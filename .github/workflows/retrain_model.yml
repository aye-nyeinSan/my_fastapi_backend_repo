name: Retrain Model on feedback data using WandB
on:
    workflow_dispatch:
      inputs:
        dataset_path:
          description: 'Path to the dataset for retraining'
          required: true  # must provide a value

    

jobs:
    
    training_model:

        runs-on: ubuntu-latest
        steps: 
          - name: checkout repository
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v4
            with:
                python-version: '3.11'
                cache: 'pip'

            
          - name: Install dependencies
            run: |
                  python -m pip install --upgrade pip
                  pip install -r ml-requirements.txt
            
  
          - name: Login WandB
            env:
              WANDB_API_KEY: ${{ secrets.WANDB_LOGIN_KEY }}
            run: |
                wandb login $WANDB_API_KEY
                echo "Logged into WandB"
          - name: Create notebooks directory
            run: |
                 mkdir -p notebooks
                
          - name: Retrain model
            run: |
                  gdown https://drive.google.com/uc?id=1051GaQKcoSi4EmYVmphlF_e4shGcklJq#scrollTo=DlSjmh1GpfMS -O notebooks/MyanSen_Model_Training.ipynb
                  papermill "notebooks/MyanSen_Model_Training.ipynb" \
                  "notebooks/retrained_sentiment_model.ipynb" \
                  --parameters  dataset_path "uploads/aye2904gmail.com2025-08-19T014749.086Z29fd8f7f-4c84-4e79-aca9-99aa2c364d88"\
                  --log-output \
                  --kernel python3 
            env:
               AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
               AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
               AWS_REGION: ${{ secrets.AWS_REGION }}
               WANDB_API_KEY: ${{ secrets.WANDB_LOGIN_KEY }}
          - name: Upload Training Logs
            uses: actions/upload-artifact@v4
            with:
              name: training-output
              path: notebooks/output_files/

           
            
        
              